coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

ignore:
  - "tests/**/*"
  - "examples/**/*"
  - "target/**/*"

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: true
