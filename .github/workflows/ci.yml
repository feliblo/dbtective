name: 🛠️ CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  lint:
    name: 📝 Lint Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 📦 Install Rustfmt
        run: rustup component add rustfmt

      - name: 🦀 Run Rustfmt
        run: cargo fmt --all -- --check

  clippy:
    name: 🔍 Lint Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 🦀 Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  shear:
    name: ✂️ Check Code Shearing (unwanted package dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 📦 Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: ✂️ Install cargo-shear
        run: cargo binstall --no-confirm cargo-shear

      - name: 🔍 Run cargo shear
        run: cargo shear

  test:
    name: 🚀 Run Test Suite
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: 📂 Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: 📦 Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: 📦 Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # ✔️ Correct stable MSVC setup action
      - name: ⚙️ Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: 🧪 Run tests + coverage (Linux)
        if: runner.os != 'Windows'
        run: |
          cargo llvm-cov nextest \
            --workspace \
            --all-features \
            --lcov \
            --output-path lcov.info

      - name: 🧪 Run tests + coverage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo llvm-cov nextest `
            --workspace `
            --all-features `
            --lcov `
            --output-path lcov.info

      - name: ☁️ Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
